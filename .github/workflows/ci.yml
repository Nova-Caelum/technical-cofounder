name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows: the shell Claude Code runs the plugin's hooks in.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/base-novacaelum
          claude plugin validate --strict plugins/super-novacaelum

      - name: Run tests
        # The tests read subprocess output as UTF-8 on every OS; the runtime
        # probe below runs without this, as a user's machine would.
        env:
          PYTHONUTF8: '1'
        run: |
          python3 -m unittest \
            tests.test_mcp \
            tests.test_verifier \
            tests.test_template_hooks \
            tests.test_installer \
            tests.test_loop \
            tests.test_ask \
            tests.test_setup_record \
            tests.test_he_bridge \
            tests.test_resolver \
            tests.test_project_env \
            tests.test_seq_thinking

      - name: Pre-warm npx for sequential-thinking
        run: npx -y @modelcontextprotocol/server-sequential-thinking < /dev/null

      - name: Claude Code runtime probe (keyless)
        run: python scripts/claude-runtime-probe.py

      - name: Option B exploration (one-off)
        continue-on-error: true
        run: python .github/scripts/explore_mcp_env.py

      - name: Registry check
        run: python plugins/base-novacaelum/registry/check_registry.py

      - name: Shellcheck hooks
        if: runner.os == 'Linux'
        run: shellcheck plugins/base-novacaelum/hooks/*.sh plugins/base-novacaelum/hooks/lib/*.sh

      - name: Leak scan (full history)
        if: runner.os == 'Linux'
        run: python3 scripts/leak-scan.py --history
