name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/base-novacaelum
          claude plugin validate --strict plugins/super-novacaelum

      - name: Run tests
        run: |
          python3 -m unittest \
            tests.test_mcp \
            tests.test_verifier \
            tests.test_template_hooks \
            tests.test_plugin_hooks \
            tests.test_installer \
            tests.test_loop \
            tests.test_contact \
            tests.test_setup_record \
            tests.test_he_bridge

      - name: Shellcheck hooks
        if: runner.os == 'Linux'
        run: shellcheck plugins/base-novacaelum/hooks/*.sh plugins/base-novacaelum/hooks/lib/*.sh

      - name: Leak scan (full history)
        if: runner.os == 'Linux'
        run: python3 scripts/leak-scan.py --history

      - name: Registry check
        if: runner.os == 'Linux'
        run: python3 plugins/base-novacaelum/registry/check_registry.py
